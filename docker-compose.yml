services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:10
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__server__DOMAIN: forgejo.sanattudu.tech
      FORGEJO__server__ROOT_URL: https://forgejo.sanattudu.tech/
      FORGEJO__server__SSH_DOMAIN: forgejo.sanattudu.tech
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__server__PROTOCOL: http
    volumes:
      - forgejo_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # SSH access for git clone/push over SSH — separate from Traefik's HTTP routing
      - "2222:2222"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`forgejo.sanattudu.tech`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.tls=true"
      - "traefik.http.routers.forgejo.tls.certresolver=letsencrypt"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"

volumes:
  forgejo_data:
